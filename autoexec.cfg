// Banana OS Quake default modern FPS bindings & optimizations
+mlook
crosshair 1
_snd_mixahead 0.15
sensitivity 5
cl_forwardspeed 400
cl_backspeed 400

// Movement (WASD / ZQSD / Arrows)
bind "w" "+forward"
bind "z" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "q" "+moveleft"
bind "d" "+moveright"
bind "UPARROW" "+forward"
bind "DOWNARROW" "+back"
bind "LEFTARROW" "+left"
bind "RIGHTARROW" "+right"

// Jump / Swim / Run / Attack
bind "SPACE" "+jump"
bind "SHIFT" "+speed"
bind "CTRL" "+attack"
bind "ALT" "+strafe"
bind "c" "+movedown"
bind "e" "+moveup"

// Mouse & Wheel
bind "MOUSE1" "+attack"
bind "MOUSE2" "+jump"
bind "MWHEELUP" "impulse 10"
bind "MWHEELDOWN" "impulse 12"
